  <rect x="124" y="172" width="264" height="32" fill="#E0A526" />
  <rect x="104" y="204" width="304" height="36" fill="#D9534F" />
  <rect x="104" y="240" width="304" height="36" fill="#D9534F" />
  <rect x="124" y="276" width="264" height="32" fill="#2A9D8F" />
  <rect x="156" y="308" width="200" height="32" fill="#2A9D8F" />

  <!-- Cutout Center / Pixel Monolith -->
  <rect x="188" y="172" width="136" height="168" fill="#F4ECD8" />
