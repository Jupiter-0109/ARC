  <rect x="88" y="144" width="336" height="40" fill="#E0A526" />
  <rect x="64" y="184" width="384" height="44" fill="#D9534F" />
  <rect x="64" y="228" width="384" height="44" fill="#D9534F" />
  <rect x="88" y="272" width="336" height="40" fill="#2A9D8F" />
  <rect x="128" y="312" width="256" height="40" fill="#2A9D8F" />

