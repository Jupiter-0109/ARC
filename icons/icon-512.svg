<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <!-- Background Paper -->
  <rect width="512" height="512" fill="#F4ECD8" />
  
  <!-- Outer Chunky Border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#2B2B2B" stroke-width="20" />
  
