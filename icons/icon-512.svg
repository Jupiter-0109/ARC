  <rect x="372" y="72" width="24" height="24" fill="#D9534F" />
  <rect x="244" y="52" width="24" height="24" fill="#E0A526" />

  <!-- Pixel Baseline Base -->
  <rect x="64" y="392" width="384" height="24" fill="#2B2B2B" />
  <rect x="112" y="416" width="288" height="16" fill="#2A9D8F" />
