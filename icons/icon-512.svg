  <!-- Center Pixel 'A' Core -->
  <rect x="232" y="180" width="48" height="32" fill="#2B2B2B" />
  <rect x="208" y="212" width="36" height="104" fill="#2B2B2B" />
  <rect x="268" y="212" width="36" height="104" fill="#2B2B2B" />
